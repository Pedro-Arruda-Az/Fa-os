<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Login Profissional</title>
    <link rel="stylesheet" href="login_profissional.css">
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <a href="/index.html" class="logo-link">
                <span class="logo">Faços</span>
                <span class="logo-sub">SERVIÇOS DOMÉSTICOS E MANUTENÇÃO</span>
            </a>
        </div>

        <!-- Card de Login -->
        <div class="login-card">
            <h1>Bem-vindo de volta!</h1>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="empresa@email.com">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="********">
            </div>

            <a href="#" class="esqueci-senha">Esqueci minha senha</a>

            <div class="form-group">
                <label>CNPJ</label>
                <input type="tel" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
            </div>

            <button class="entrar-btn" id="entrarBtn">entrar</button>

            <div class="cadastrar-link">
                Ainda não tem uma conta? <a href="#" id="cadastrarEmpresaBtn">Cadastrar empresa</a>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO DE EMPRESA -->
    <div id="cadastroModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Cadastrar empresa</h2>
            
            <div class="form-group">
                <label>Nome da empresa</label>
                <input type="text" id="empresaNome" placeholder="Digite o nome da empresa">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="empresaEmail" placeholder="empresa@email.com">
            </div>

            <div class="form-group">
                <label>CNPJ</label>
                <input type="tel" id="empresaCnpj" placeholder="00.000.000/0000-00" maxlength="18">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="tel" id="empresaTelefone" placeholder="(00) 00000-0000" maxlength="15">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="empresaSenha" placeholder="Digite sua senha">
            </div>

            <div class="form-group">
                <label>Confirmar senha</label>
                <input type="password" id="empresaConfirmarSenha" placeholder="Confirme sua senha">
            </div>

            <button class="criar-btn" id="criarEmpresaBtn">criar conta</button>
            
            <div class="fazer-login">
                Já tem uma conta? <a id="voltarLogin">fazer login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="login_profissional.js"></script>
</body>
</html>
