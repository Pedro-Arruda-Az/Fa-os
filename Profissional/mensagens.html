<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Mensagens com Clientes</title>
    <link rel="stylesheet" href="mensagens.css">
    <script src="theme.js"></script>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="header-left">
            <a href="/index.html" class="brand-link">
                <img src="/imagens/facos-logo-marrom.png" alt="Faços" class="logo-full">
            </a>
        </div>
        <div class="header-right">
            <a href="/index.html" class="icon-btn" title="Início" aria-label="Início">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
            </a>
            <a href="#" class="icon-btn" id="perfilBtn" title="Perfil" aria-label="Perfil">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
        </div>
    </header>

    <!-- ========== CONTEÚDO PRINCIPAL ========== -->
    <main class="page">
        <div class="page-title-row">
            <a href="/Profissional/dashboard.html" class="back-btn" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </a>
            <h1 class="page-title" data-i18n="titulo.mensagens">mensagens com clientes</h1>
        </div>

        <div class="mensagens-layout">

            <!-- ===== LISTA DE CONVERSAS ===== -->
            <section class="conversas-panel">
                <h2 class="panel-title">conversas</h2>
                <div class="conversas-list" id="conversasList">
                    <!-- conversas inseridas via JS -->
                </div>
            </section>

            <!-- ===== JANELA DE CHAT ===== -->
            <section class="chat-panel">
                <h2 class="chat-contato-nome" id="chatContatoNome">Selecione uma conversa</h2>
                <div class="chat-divider"></div>

                <div class="chat-mensagens" id="chatMensagens">
                    <!-- mensagens inseridas via JS -->
                </div>

                <div class="chat-input-row">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Digite sua mensagem..." autocomplete="off">
                    <button class="enviar-btn" id="enviarBtn">Enviar</button>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="mensagens.js"></script>
</body>
</html>
