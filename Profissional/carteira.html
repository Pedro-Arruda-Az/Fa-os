<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Carteira</title>
    <link rel="stylesheet" href="carteira.css">
    <script src="theme.js"></script>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="header-left">
            <a href="/index.html" class="brand-link">
                <img src="/imagens/facos-logo-marrom.png" alt="Faços" class="logo-full">
            </a>
        </div>
        <div class="header-right">
            <a href="/Profissional/perfil.html" class="icon-btn" id="perfilBtn" title="Perfil" aria-label="Perfil">
                <img src="/imagens/pessoa.png" alt="Perfil">
            </a>
            <div class="icon-btn config-wrap">
                <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                    <img src="/imagens/engrenagem.png" alt="Configurações">
                </button>
                <div class="config-menu" id="configMenu">
                    <button class="config-item" id="modoClaroBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                    </button>
                    <button class="config-item" id="idiomaBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                        <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                    </button>
                    <button class="config-item config-item-sair" id="sairBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                        <span data-i18n="menu.sair">Sair</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-title-row">
            <a href="/Profissional/dashboard.html" class="back-btn" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </a>
            <h1 class="page-title" data-i18n="titulo.carteira">carteira</h1>
        </div>

        <div class="saldo-row">
            <div class="saldo-card saldo-principal">
                <div class="saldo-topo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
                    <span>Saldo disponível</span>
                </div>
                <span class="saldo-valor" id="saldoValor">R$ 0,00</span>
                <span class="saldo-sub">Disponível para saque</span>
            </div>
        </div>

        <div class="acoes-row">
            <button class="btn-sacar" id="sacarBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
                Sacar dinheiro
            </button>
            <button class="btn-pix" id="pixBtn">Transferir via Pix</button>
        </div>


        <div class="conteudo-grid">

            <section class="historico-card">
                <div class="historico-header">
                    <h2 class="card-titulo">Histórico de transações</h2>
                    <button class="btn-exportar" id="exportarBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Exportar
                    </button>
                </div>

                <div class="filtros-row">
                    <button class="filtro-btn active" data-filtro="todos">Todos</button>
                    <button class="filtro-btn" data-filtro="ganhos">Ganhos</button>
                    <button class="filtro-btn" data-filtro="saques">Saques</button>
                    <button class="filtro-btn" data-filtro="taxas">Taxas</button>
                </div>

                <div class="transacoes-list" id="transacoesList">
                </div>
            </section>

            <aside class="sidebar-col">

                <div class="dados-card">
                    <h2 class="card-titulo">Dados de pagamento</h2>

                    <div class="dado-item">
                        <span class="dado-label">Chave Pix</span>
                        <span class="dado-valor" id="dadoChavePix">Não cadastrada</span>
                    </div>

                    <div class="dado-item">
                        <span class="dado-label">CNPJ</span>
                        <span class="dado-valor" id="dadoCnpj">—</span>
                    </div>

                    <div class="dado-item">
                        <span class="dado-label">Banco</span>
                        <span class="dado-valor" id="dadoBanco">Não cadastrado</span>
                    </div>

                    <button class="btn-editar" id="editarDadosBtn">Editar dados</button>
                </div>

                <div class="ganhos-card">
                    <h2 class="card-titulo">Ganhos recentes</h2>

                    <div class="ganho-semana">
                        <div class="ganho-linha">
                            <span>Semana 1</span>
                            <span>R$ 450</span>
                        </div>
                        <div class="ganho-barra"><div class="ganho-fill" style="width: 66%;"></div></div>
                    </div>

                    <div class="ganho-semana">
                        <div class="ganho-linha">
                            <span>Semana 2</span>
                            <span>R$ 680</span>
                        </div>
                        <div class="ganho-barra"><div class="ganho-fill" style="width: 100%;"></div></div>
                    </div>

                    <div class="ganho-semana">
                        <div class="ganho-linha">
                            <span>Semana 3</span>
                            <span>R$ 520</span>
                        </div>
                        <div class="ganho-barra"><div class="ganho-fill" style="width: 76%;"></div></div>
                    </div>

                    <div class="ganho-semana">
                        <div class="ganho-linha">
                            <span>Semana 4</span>
                            <span>R$ 500</span>
                        </div>
                        <div class="ganho-barra"><div class="ganho-fill" style="width: 74%;"></div></div>
                    </div>
                </div>

            </aside>
        </div>
    </main>

    <div class="modal-overlay" id="editarDadosModal">
        <div class="modal-card">
            <button class="modal-close" id="fecharEditarDadosModal">&times;</button>
            <h2 class="card-titulo">Editar dados de pagamento</h2>

            <label class="form-label">Chave Pix</label>
            <input type="text" id="inputChavePix" class="form-input" placeholder="email, telefone, CPF/CNPJ ou chave aleatória">

            <label class="form-label">Banco</label>
            <input type="text" id="inputBanco" class="form-input" placeholder="Ex: Banco do Brasil, Nubank...">

            <button class="btn-editar" id="salvarDadosBtn" style="margin-top:1rem;">Salvar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="/Shared/notificacoes-badge.js"></script>
    <script src="carteira.js"></script>
</body>
</html>
