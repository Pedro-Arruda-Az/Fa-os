<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Painel Profissional</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <script src="theme.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="/index.html" class="brand-link">
                <img src="/imagens/facos-logo-marrom.png" alt="Faços" class="logo-full">
            </a>
        </div>
        <div class="header-right">
            <a href="/Profissional/perfil.html" class="icon-btn" id="perfilBtn" title="Perfil" aria-label="Perfil">
                <img src="/imagens/icones-claro/perfil.png" alt="Perfil">
            </a>
            <div class="icon-btn config-wrap">
                <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                    <img src="/imagens/engrenagem.png" alt="Configurações">
                </button>
                <div class="config-menu" id="configMenu">
                    <button class="config-item" id="modoClaroBtn">
                        <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-claro-sol.png" alt="" width="18" height="18">
                        <span id="modoClaroLabel" data-i18n="menu.modoClaro">Modo claro</span>
                    </button>
                    <button class="config-item" id="idiomaBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                        <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                    </button>
                    <button class="config-item config-item-sair" id="sairBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                        <span data-i18n="menu.sair">Sair</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <h1 class="titulo-painel" data-i18n="painel.titulo">Painel profissional</h1>

        <div class="painel-grid">

            <div class="resumo-card">
                <span class="resumo-label" data-i18n="painel.resumoDoDia">Resumo do dia</span>

                <div class="resumo-corpo">
                    <div class="resumo-numeros">
                        <span class="resumo-atendimentos" id="resumoAtendimentos">3 <span data-i18n="painel.atendimentos">atendimentos</span></span>
                        <span class="resumo-valor" id="resumoValor">R$ 480,00 <span data-i18n="painel.previstos">previstos</span></span>
                    </div>
                    <img src="/imagens/buzz-resumo.png" alt="Buzz" class="resumo-buzz">
                </div>

                <div class="resumo-tags">
                    <span class="tag" id="tagConfirmados">2 <span data-i18n="painel.confirmados">confirmados</span></span>
                    <span class="tag" id="tagPendentes">1 <span data-i18n="painel.pendente">pendente</span></span>
                </div>
            </div>

            <nav class="lista-card">
                <a href="/Profissional/mensagens.html" class="lista-item" id="mensagensCard">
                    <img src="/imagens/icones-escuro/mensagens.png" alt="">
                    <span data-i18n="painel.mensagens">Mensagens</span>
                </a>
                <a href="/Profissional/pepe.html" class="lista-item" id="pedidosCard">
                    <img src="/imagens/icones-escuro/pedidos.png" alt="">
                    <span data-i18n="painel.pedidos">Pedidos</span>
                </a>
                <a href="/Profissional/notificacoes.html" class="lista-item" id="notificacoesCard">
                    <img src="/imagens/icones-escuro/notificacoes.png" alt="">
                    <span data-i18n="painel.notificacoes">Notificações</span>
                    <span class="badge" id="notifBadge" data-notif-badge style="display:none;">0</span>
                </a>
                <a href="/Profissional/mapa.html" class="lista-item" id="mapaCard">
                    <img src="/imagens/icones-escuro/localizacao.png" alt="">
                    <span data-i18n="painel.localizacao">Localização</span>
                </a>
                <a href="/Profissional/carteira.html" class="lista-item" id="carteiraCard">
                    <img src="/imagens/icones-escuro/carteira.png" alt="">
                    <span data-i18n="painel.carteira">Carteira</span>
                </a>
            </nav>

        </div>

        <div class="ultimas-notif-header">
            <h2 class="secao-titulo-painel" data-i18n="painel.ultimasNotificacoes">Últimas notificações</h2>
            <a href="/Profissional/notificacoes.html" class="ver-todas-link" data-i18n="painel.verTodas">Ver todas</a>
        </div>
        <div class="ultimas-notif-grid" id="ultimasNotifGrid">
        </div>
    </main>

    <button class="help-button" id="helpBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span data-i18n="painel.ajudaSuporte">Ajuda e suporte</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="/Shared/notificacoes-badge.js"></script>
    <script src="dashboard.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
