<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Notificações</title>
    <link rel="stylesheet" href="notificacoes.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <script src="theme.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="/index.html" class="brand-link">
                <img src="/imagens/facos-logo-marrom.png" alt="Faços" class="logo-full">
            </a>
        </div>
        <div class="header-right">
            <a href="/Profissional/perfil.html" class="icon-btn" id="perfilBtn" title="Perfil" aria-label="Perfil">
                <img src="/imagens/icones-claro/perfil.png" alt="Perfil">
            </a>
            <div class="icon-btn config-wrap">
                <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                    <img src="/imagens/engrenagem.png" alt="Configurações">
                </button>
                <div class="config-menu" id="configMenu">
                    <button class="config-item" id="modoClaroBtn">
                        <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-escuro-lua.png" alt="" width="18" height="18">
                        <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                    </button>
                    <button class="config-item" id="idiomaBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                        <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                    </button>
                    <button class="config-item config-item-sair" id="sairBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                        <span data-i18n="menu.sair">Sair</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-title-row">
            <a href="/Profissional/dashboard.html" class="back-btn" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </a>
            <h1 class="page-title" data-i18n="titulo.notificacoes">notificações</h1>

            <button class="btn-marcar-lidas" id="marcarLidasBtn">Marcar todas como lidas</button>
        </div>

        <div class="notif-grid">

            <section class="notif-coluna">

                <h2 class="secao-titulo">Novas</h2>

                <div class="notif-list" id="notifNovas">
                    
                </div>

                <h2 class="secao-titulo">Anteriores</h2>

                <div class="notif-list" id="notifAnteriores">

                </div>

            </section>

            <aside class="sidebar-col">

                <div class="resumo-card">
                    <h2 class="card-titulo">Resumo</h2>

                    <div class="resumo-linha">
                        <span>Novas</span>
                        <span class="resumo-valor" id="resumoNovas">3</span>
                    </div>
                    <div class="resumo-linha">
                        <span>Não lidas</span>
                        <span class="resumo-valor" id="resumoNaoLidas">5</span>
                    </div>
                    <div class="resumo-linha">
                        <span>Total</span>
                        <span class="resumo-valor" id="resumoTotal">7</span>
                    </div>
                </div>

                <div class="prefs-card">
                    <h2 class="card-titulo">Preferências</h2>

                    <label class="pref-linha">
                        <span>Pagamentos</span>
                        <input type="checkbox" class="pref-check" data-pref="pagamentos" checked>
                    </label>
                    <label class="pref-linha">
                        <span>Mensagens</span>
                        <input type="checkbox" class="pref-check" data-pref="mensagens" checked>
                    </label>
                    <label class="pref-linha">
                        <span>Lembretes</span>
                        <input type="checkbox" class="pref-check" data-pref="lembretes" checked>
                    </label>
                </div>

                <div class="filtros-card">
                    <h2 class="card-titulo">Filtros rápidos</h2>

                    <div class="filtros-lista">
                        <button class="filtro-rapido-btn" data-filtro="nao-lidas">Apenas não lidas</button>
                        <button class="filtro-rapido-btn" data-filtro="pagamentos">Pagamentos</button>
                        <button class="filtro-rapido-btn" data-filtro="mensagens">Mensagens</button>
                        <button class="filtro-rapido-btn" data-filtro="lembretes">Lembretes</button>
                    </div>
                </div>

            </aside>
        </div>
    </main>

    <button class="help-button" id="helpBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Ajuda / Suporte
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="/Shared/notificacoes-badge.js"></script>
    <script src="notificacoes.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
