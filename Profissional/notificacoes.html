<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Notificações</title>
    <link rel="stylesheet" href="notificacoes.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <script src="theme.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="/index.html" class="brand-link">
                <img src="/imagens/facos-logo-marrom.png" alt="Faços" class="logo-full">
            </a>
        </div>

            <nav class="nav-pills">
                <a href="/Profissional/dashboard.html" class="nav-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
                    <span data-i18n="nav.inicio">Início</span>
                </a>
                <a href="/Profissional/pepe.html" class="nav-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
                    <span data-i18n="painel.pedidos">Pedidos</span>
                </a>
                <a href="/Profissional/carteira.html" class="nav-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    <span data-i18n="painel.carteira">Carteira</span>
                </a>
                <a href="/Profissional/mensagens.html" class="nav-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                    <span data-i18n="painel.mensagens">Mensagens</span>
                </a>
                <a href="/Profissional/mapa.html" class="nav-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span data-i18n="painel.localizacao">Localização</span>
                </a>
            </nav>

        <div class="header-right">
            <a href="/Profissional/perfil.html" class="icon-btn" id="perfilBtn" title="Perfil" aria-label="Perfil">
                <img src="/imagens/icones-claro/perfil.png" alt="Perfil">
            </a>
            <div class="icon-btn config-wrap">
                <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                    <img src="/imagens/engrenagem.png" alt="Configurações">
                </button>
                <div class="config-menu" id="configMenu">
                    <button class="config-item" id="modoClaroBtn">
                        <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-escuro-lua.png" alt="" width="18" height="18">
                        <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                    </button>
                    <button class="config-item" id="idiomaBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                        <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                    </button>
                    <button class="config-item config-item-sair" id="sairBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                        <span data-i18n="menu.sair">Sair</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-title-row">
            <a href="/Profissional/dashboard.html" class="back-btn" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            </a>
            <h1 class="page-title" data-i18n="titulo.notificacoes">Notificações</h1>

            <button class="btn-marcar-lidas" id="marcarLidasBtn" data-i18n="notificacoes.marcarTodasLidas">Marcar todas como lidas</button>
        </div>

        <div class="notif-grid">

            <section class="notif-coluna">

                <h2 class="secao-titulo" data-i18n="notificacoes.novas">Novas</h2>

                <div class="notif-list" id="notifNovas">

                </div>

                <h2 class="secao-titulo" data-i18n="notificacoes.anteriores">Anteriores</h2>

                <div class="notif-list" id="notifAnteriores">

                </div>

            </section>

            <aside class="sidebar-col">

                <div class="resumo-card">
                    <h2 class="card-titulo" data-i18n="notificacoes.resumo">Resumo</h2>

                    <div class="resumo-linha">
                        <span data-i18n="notificacoes.novas">Novas</span>
                        <span class="resumo-valor" id="resumoNovas">3</span>
                    </div>
                    <div class="resumo-linha">
                        <span data-i18n="notificacoes.naoLidas">Não lidas</span>
                        <span class="resumo-valor" id="resumoNaoLidas">5</span>
                    </div>
                    <div class="resumo-linha">
                        <span data-i18n="notificacoes.total">Total</span>
                        <span class="resumo-valor" id="resumoTotal">7</span>
                    </div>
                </div>

                <div class="prefs-card">
                    <h2 class="card-titulo" data-i18n="notificacoes.preferencias">Preferências</h2>

                    <label class="pref-linha">
                        <span data-i18n="notificacoes.pagamentos">Pagamentos</span>
                        <input type="checkbox" class="pref-check" data-pref="pagamentos" checked>
                    </label>
                    <label class="pref-linha">
                        <span data-i18n="painel.mensagens">Mensagens</span>
                        <input type="checkbox" class="pref-check" data-pref="mensagens" checked>
                    </label>
                    <label class="pref-linha">
                        <span data-i18n="notificacoes.lembretes">Lembretes</span>
                        <input type="checkbox" class="pref-check" data-pref="lembretes" checked>
                    </label>
                </div>

                <div class="filtros-card">
                    <h2 class="card-titulo" data-i18n="notificacoes.filtrosRapidos">Filtros rápidos</h2>

                    <div class="filtros-lista">
                        <button class="filtro-rapido-btn" data-filtro="nao-lidas" data-i18n="notificacoes.apenasNaoLidas">Apenas não lidas</button>
                        <button class="filtro-rapido-btn" data-filtro="pagamentos" data-i18n="notificacoes.pagamentos">Pagamentos</button>
                        <button class="filtro-rapido-btn" data-filtro="mensagens" data-i18n="painel.mensagens">Mensagens</button>
                        <button class="filtro-rapido-btn" data-filtro="lembretes" data-i18n="notificacoes.lembretes">Lembretes</button>
                    </div>
                </div>

            </aside>
        </div>
    </main>

    <button class="help-button" id="helpBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span data-i18n="painel.ajudaSuporte">Ajuda / Suporte</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <script src="/Shared/notificacoes-badge.js"></script>
    <script src="notificacoes.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
