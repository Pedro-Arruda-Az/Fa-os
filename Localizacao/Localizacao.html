<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Serviços Próximos</title>
    <link rel="stylesheet" href="Localizacao.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="header-left">
            <img src="/imagens/upscalemedia-transformed.png" alt="Faços" class="logo-img">
        </div>
        <div class="header-right">
            <div class="header-icons">
                <a href="/Landing Page/Perfil.html" class="icon-btn" title="Perfil">
                    <img src="/imagens/pessoa.png" alt="Perfil" width="32">
                </a>
                <a href="/Landing Page/TelaIni.html" class="icon-btn" title="Home">
                    <img src="/imagens/casa.png" alt="Home" width="28">
                </a>
                <div class="config-wrap">
                    <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                        <img src="/imagens/engrenagem.png" alt="Configurações" width="26px">
                    </button>
                    <div class="config-menu" id="configMenu">
                        <button class="config-item" id="modoClaroBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                            <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                        </button>
                        <button class="config-item" id="idiomaBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                            <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                        </button>
                        <button class="config-item config-item-sair" id="logoutBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                            <span data-i18n="menu.sair">Sair</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== MAIN CONTAINER ========== -->
    <div class="main-container">

        <!-- SIDEBAR -->
        <div class="sidebar-trigger"></div>
        <aside class="sidebar">
            <a href="/Chat/Chat.html" class="sidebar-icon" title="Chat">
                <img src="/imagens/balao-de-bate-papo.png" alt="Chat" width="32">
            </a>
            <!-- LOCALIZAÇÃO - LINK ATUALIZADO (ATIVO) -->
            <a href="/Localizacao/Localizacao.html" class="sidebar-icon active" title="Localização">
                <img src="/imagens/localizacao.png" alt="Localização" width="36">
            </a>
            <a href="/Pedidos/Pedidos.html" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/prancheta.png" alt="Pedidos" width="28">
            </a>
            <a href="/Pagamentos/Pagamentos.html" class="sidebar-icon" title="Pagamento">
                <img src="/imagens/cartao.png" alt="Pagamento" width="28">
            </a>
            <a href="/Sino/Sino.html" class="sidebar-icon" title="Notificações">
                <img src="/imagens/notificacao.png" alt="Notificações" width="28">
            </a>
            <button class="sidebar-toggle" id="sidebarToggle" title="Recolher">&#8249;</button>
        </aside>

        <!-- ========== LISTA DE SERVIÇOS PRÓXIMOS ========== -->
        <section class="list-panel">
            <div class="list-header">
                <h2>Serviços Próximos</h2>
            </div>

            <div class="search-box">
                <span class="search-icon"></span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="procurar por serviço / profissional"
                    autocomplete="off"
                >
            </div>

            <div class="results-count" id="resultsCount">5 profissionais encontrados</div>

            <div class="professionals-list" id="professionalsList">
                <!-- Cards gerados pelo JS -->
            </div>
        </section>

        <!-- ========== MAPA ========== -->
        <section class="map-panel" id="mapPanel">
            <div id="map"></div>
            <div class="map-overlay-label">São Paulo</div>
        </section>
    </div>

    <!-- BOTÃO AJUDA - MANTIDO -->
    <button class="help-button">
        Ajuda / Suporte
    </button>

    <!-- ========== BOTÃO MODO ESCURO ========== -->

    <!-- Leaflet (mapa open-source) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/i18n-cliente.js"></script>
    <script src="Localizacao.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
