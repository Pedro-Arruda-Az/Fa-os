<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Pagamentos</title>
    <link rel="stylesheet" href="Pagamentos.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <img src="/imagens/upscalemedia-transformed.png" alt="Faços" class="logo-img">
        </div>
        <div class="header-right">
            <div class="header-icons">
                <a href="/Landing Page/Perfil.html" class="icon-btn" title="Perfil">
                    <img src="/imagens/icones-claro/perfil.png" alt="Perfil" width="32">
                </a>
                <a href="/Landing Page/TelaIni.html" class="icon-btn" title="Home">
                    <img src="/imagens/icones-claro/casinha-header.png" alt="Home" width="28">
                </a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="/Chat/Chat.html" class="sidebar-icon" title="Chat">
                <img src="/imagens/icones-claro/mensagens.png" alt="Chat" width="32">
            </a>
            <a href="/Localizacao/Localizacao.html" class="sidebar-icon" title="Localização">
                <img src="/imagens/icones-claro/localizacao.png" alt="Localização" width="36">
            </a>
            <a href="/Pedidos/Pedidos.html" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/icones-claro/pedidos.png" alt="Pedidos" width="28">
            </a>
            <a href="/Pagamentos/Pagamentos.html" class="sidebar-icon active" title="Pagamento">
                <img src="/imagens/icones-claro/carteira.png" alt="Pagamento" width="28">
            </a>
            <a href="/Sino/Sino.html" class="sidebar-icon" title="Notificações">
                <img src="/imagens/icones-claro/notificacoes.png" alt="Notificações" width="28">
                <span class="notif-badge" data-notif-badge style="display:none;"></span>
            </a>
            <div class="config-wrap">
                    <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                        <img src="/imagens/engrenagem.png" alt="Configurações" width="22px">
                    </button>
                    <div class="config-menu config-menu-sidebar" id="configMenu">
                        <button class="config-item" id="modoClaroBtn">
                            <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-escuro-lua.png" alt="" width="18" height="18">
                            <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                        </button>
                        <button class="config-item" id="idiomaBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                            <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                        </button>
                        <button class="config-item config-item-sair" id="logoutBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                            <span data-i18n="menu.sair">Sair</span>
                        </button>
                    </div>
                </div>
        </aside>

        <main class="pagamentos-content">
            <h1 class="page-title">Pagamentos e Transações</h1>

            <div class="saldo-container">
                <div class="saldo-item saldo-principal">
                    <span class="saldo-label">saldo disponível</span>
                    <span class="saldo-valor positivo" id="saldoValor">R$ 280,00</span>
                    <button class="adicionar-credito-btn" id="adicionarCreditoBtn">Adicionar crédito</button>
                </div>
                <div class="saldo-item total-gasto">
                    <span class="saldo-label">total gasto</span>
                    <span class="saldo-valor gasto" id="totalGasto">R$ 880,00</span>
                </div>
            </div>

            <h2 class="section-title">histórico de transações</h2>

            <div class="transacoes-list" id="transacoesList">
            </div>
        </main>
    </div>

    <button class="help-button">
        Ajuda / Suporte
    </button>

    <div class="modal-overlay" id="creditoModal">
        <div class="modal-card">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 class="modal-title">Adicionar crédito</h2>
            <p class="modal-subtitle">Escolha o valor e a forma de pagamento</p>

            <div class="valor-opcoes">
                <button class="valor-btn" data-valor="50">R$ 50</button>
                <button class="valor-btn" data-valor="100">R$ 100</button>
                <button class="valor-btn" data-valor="200">R$ 200</button>
                <button class="valor-btn" data-valor="500">R$ 500</button>
            </div>

            <div class="modal-form-group">
                <label>Valor personalizado</label>
                <input type="number" id="valorPersonalizado" placeholder="Digite o valor" min="1">
            </div>

            <div class="modal-form-group">
                <label for="formaPagamento">Forma de pagamento</label>
                <select id="formaPagamento" aria-label="Forma de pagamento">
                    <option value="cartao">Cartão de crédito</option>
                    <option value="pix">PIX</option>
                    <option value="boleto">Boleto</option>
                </select>
            </div>

            <button class="confirmar-pagamento-btn" id="confirmarPagamentoBtn">Confirmar pagamento</button>
        </div>
    </div>
    <script src="/Shared/i18n-cliente.js"></script>
    <script src="/Shared/notificacoes-badge.js"></script>

    <script src="Pagamentos.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
