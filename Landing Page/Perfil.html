<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Meu Perfil</title>
    <link rel="stylesheet" href="/Landing Page/Perfil.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/imagens/upscalemedia-transformed.png" alt="Faços" width="100px">
        </div>
        <div class="header-right">
            <div class="header-icons">
                <a href="/Landing Page/Perfil.html" class="perfil-link">
                    <img src="/imagens/icones-claro/perfil.png" alt="Perfil" width="35px">
                </a>
                <a href="/Landing Page/TelaIni.html" class="home-link">
                    <img src="/imagens/icones-claro/casinha-header.png" alt="Home" width="28px">
                </a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="/Chat/Chat.html" class="sidebar-icon" title="Chat">
                <img src="/imagens/icones-claro/mensagens.png" alt="Chat" width="32px">
            </a>
            <a href="/Localizacao/Localizacao.html" class="sidebar-icon" title="Localização">
                <img src="/imagens/icones-claro/localizacao.png" alt="Localização" width="32px">
            </a>
            <a href="/Pedidos/Pedidos.html" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/icones-claro/pedidos.png" alt="Pedidos" width="32px">
            </a>
            <a href="/Pagamentos/Pagamentos.html" class="sidebar-icon" title="Pagamento">
                <img src="/imagens/icones-claro/carteira.png" alt="Pagamento" width="32px">
            </a>
            <a href="/Sino/Sino.html" class="sidebar-icon" title="Notificações">
                <img src="/imagens/icones-claro/notificacoes.png" alt="Notificações" width="32px">
                <span class="notif-badge" data-notif-badge style="display:none;"></span>
            </a>
            <div class="config-wrap">
                <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                    <img src="/imagens/engrenagem.png" alt="Configurações" width="22px">
                </button>
                <div class="config-menu config-menu-sidebar" id="configMenu">
                    <button class="config-item" id="modoClaroBtn">
                        <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-escuro-lua.png" alt="" width="18" height="18">
                        <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                    </button>
                    <button class="config-item" id="idiomaBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                        <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                    </button>
                    <button class="config-item config-item-sair" id="logoutBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                        <span data-i18n="menu.sair">Sair</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="perfil-container">
            
            <div class="perfil-grid">
                <div class="perfil-info-card">
                    <div class="foto-perfil">
                        <div class="avatar-circle" id="avatarCircle">
                            <span id="avatarIniciais">U</span>
                        </div>
                        <button class="trocar-foto-btn" id="trocarFotoBtn">Trocar foto</button>
                        <input type="file" id="fotoInput" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="perfil-edit-card">
                    <h2 class="edit-title">Editar seu perfil</h2>

                    <div class="edit-form">
                        <div class="form-group">
                            <label>Nome:</label>
                            <input type="text" id="editNome" placeholder="Seu nome completo">
                        </div>

                        <div class="form-group">
                            <label>Telefone:</label>
                            <input type="tel" id="editTelefone" placeholder="(00) 00000-0000" maxlength="15">
                        </div>

                        <div class="form-group">
                            <label>Sexo:</label>
                            <select id="editSexo">
                                <option value="Prefiro não dizer">Prefiro não dizer</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Endereço:</label>
                            <input type="text" id="editEndereco" placeholder="Rua, número, bairro, cidade - Estado">
                        </div>

                        <div class="form-group">
                            <label>Senha:</label>
                            <input type="password" id="editSenha" placeholder="**********">
                            <small class="senha-obs">Deixe em branco para manter a mesma senha</small>
                        </div>

                        <button class="salvar-btn" id="salvarBtn">salvar alterações</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <button class="help-button" id="helpButton">
        Ajuda / Suporte
    </button>

    <script src="/Shared/i18n-cliente.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/Shared/notificacoes-badge.js"></script>
    <script src="/Landing Page/Perfil.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
