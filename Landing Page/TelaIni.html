<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Encontre profissionais</title>
    <link rel="stylesheet" href="/css/TelaIni.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="header-icon"><img src="/imagens/upscalemedia-transformed.png" alt="Facos" width="100px"></span>
        </div>
        <div class="header-right">
            <a href="/Profissional/home_profissional.html" class="header-link">seja um profissional</a>
            <div class="header-icons">
                <a href="/Landing Page/TelaIni.html" style="display:flex;align-items:center;"><span class="header-icon-item" width="15px"><img src="/imagens/casa.png" alt="Home" width="28px"></span></a>
                <span class="header-icon-item"><img src="imagens/pessoa.png" alt="" width="35px"></span>
                <button class="logout-btn" id="logoutBtn">sair</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <img src="/imagens/balao-de-bate-papo.png" alt="" width = "32px">
            <img src="/imagens/localizacao.png" alt="" width = "40px">
            <img src="/imagens/prancheta.png" alt="" width = "32px">
            <img src="/imagens/cartao.png" alt="" width = "32px">
            <img src="/imagens/notificacao.png" alt="" width = "32px">
        </aside>

        <main class="content">
            <h1 class="title">encontre profissionais disponíveis<br>perto de você!</h1>

            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon"></span>
                    <input type="text" class="search-input" placeholder="procurar por serviço / profissional">
                </div>
            </div>

            <h2 class="section-title">serviços mais procurados</h2>
            <div class="services-grid">
                <div class="service-card">
                    <a href="/Serviços/Limpeza.html">Limpeza residencial</a>
                </div>
                <div class="service-card">
                    <a href="#">Eletricista</a>
                </div>
                <div class="service-card">
                    <a href="#">Encanador</a>
                </div>
                <div class="service-card">
                    <a href="#">Montagem de móveis</a>
                </div>
                <div class="service-card">
                    <a href="#">Pequenos reparos</a>
                </div>
                <div class="service-card">
                    <a href="#">Jardinagem</a>
                </div>
            </div>

            <h2 class="section-title">estatísticas da plataforma</h2>
        </main>
    </div>

    <button class="help-button">
        <span>❓</span>
        ajuda / suporte
    </button>

    <script>
        function verificarLogin() {
            const usuarioLogado = localStorage.getItem('usuarioLogado');
            if (!usuarioLogado) {
                window.location.href = '/index.html';
            }
        }
        
        function fazerLogout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = '/index.html';
        }
        
        verificarLogin();
        
        document.getElementById('logoutBtn').addEventListener('click', fazerLogout);
    </script>
</body>
</html>
