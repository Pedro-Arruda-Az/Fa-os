<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Encontre profissionais</title>
    <link rel="stylesheet" href="/Landing Page/TelaIni.css">
    <style>
        .home-link,
        .perfil-link {
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .home-link:hover,
        .perfil-link:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <span class="header-icon">
                <img class="tipografia" src="/imagens/upscalemedia-transformed.png" alt="Facos" width="100px">
            </span>
        </div>
        <div class="header-right">
            <a href="/Profissional/home_profissional.html" class="header-link">Seja um profissional</a>
            <div class="header-icons">
                <!-- BOTÃO PERFIL (LADO ESQUERDO DA CASA) -->
                <a href="/Landing Page/Perfil.html" class="perfil-link" title="Meu Perfil">
                    <img src="/imagens/pessoa.png" alt="Perfil" width="32px">
                </a>
                <!-- BOTÃO HOME -->
                <a href="/Landing Page/TelaIni.html" class="home-link" title="Início">
                    <img src="/imagens/casa.png" alt="Home" width="28px">
                </a>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <img src="/imagens/balao-de-bate-papo.png" alt="Chat" width="32px">
            <img src="/imagens/localizacao.png" alt="Localização" width="32px">
            <img src="/imagens/prancheta.png" alt="Pedidos" width="32px">
            <img src="/imagens/cartao.png" alt="Pagamento" width="32px">
            <img src="/imagens/notificacao.png" alt="Notificações" width="32px">
        </aside>

        <main class="content">
            <h1 class="title">Encontre profissionais disponíveis<br>perto de você!</h1>

            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon"></span>
                    <input type="text" class="search-input" placeholder="procurar por serviço / profissional">
                </div>
            </div>

            <h2 class="section-title">Serviços mais procurados</h2>
            <div class="services-grid">
                <div class="service-card">
                    <a href="/Serviços/Limpeza.html">Limpeza residencial</a>
                </div>
                <div class="service-card">
                    <a href="#">Eletricista</a>
                </div>
                <div class="service-card">
                    <a href="#">Encanador</a>
                </div>
                <div class="service-card">
                    <a href="#">Montagem de móveis</a>
                </div>
                <div class="service-card">
                    <a href="#">Pequenos reparos</a>
                </div>
                <div class="service-card">
                    <a href="#">Jardinagem</a>
                </div>
            </div>

            <h2 class="section-title">Estatísticas da plataforma</h2>
        </main>
    </div>

    <!-- BOTÃO AJUDA -->
    <button class="help-button">
        <span>❓</span>
        Ajuda / Suporte
    </button>

    <!-- BOTÃO MODO ESCURO -->
    <button class="dark-mode-toggle-ini" id="darkModeToggleIni">
        <img src="/imagens/lua.png" alt="lua" width="15px"> Modo escuro
    </button>

    <script src="/Landing Page/TelaIni.js"></script>
</body>

</html>
