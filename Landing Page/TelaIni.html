<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Encontre profissionais</title>
    <link rel="stylesheet" href="/Landing Page/TelaIni.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <style>
        .home-link,
        .perfil-link {
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .home-link:hover,
        .perfil-link:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <span class="header-icon">
                <img src="/imagens/upscalemedia-transformed.png" alt="Facos" width="100px">
            </span>
        </div>
        <div class="header-right">
            <!-- LINK ATUALIZADO -->
            <a href="/Profissional/login_profissional.html" class="header-link">Seja um Profissional</a>
            <div class="header-icons">
                <a href="/Landing Page/Perfil.html" class="perfil-link" title="Meu Perfil">
                    <img src="/imagens/pessoa.png" alt="Perfil" width="32px">
                </a>
                <a href="/Landing Page/TelaIni.html" class="home-link" title="Início">
                    <img src="/imagens/casa.png" alt="Home" width="28px">
                </a>
                <button class="logout-btn" id="logoutBtn">Sair</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="/Chat/Chat.html" class="sidebar-icon" title="Chat">
                <img src="/imagens/balao-de-bate-papo.png" alt="Chat" width="32px">
            </a>
            <a href="/Localizacao/Localizacao.html" class="sidebar-icon" title="Localização">
                <img src="/imagens/localizacao.png" alt="Localização" width="40px">
            </a>
            <a href="/Pedidos/Pedidos.html" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/prancheta.png" alt="Pedidos" width="32px">
            </a>
            <a href="/Pagamentos/Pagamentos.html" class="sidebar-icon" title="Pagamento">
                <img src="/imagens/cartao.png" alt="Pagamento" width="32px">
            </a>
            <a href="/Sino/Sino.html" class="sidebar-icon" title="Notificações">
                <img src="/imagens/notificacao.png" alt="Notificações" width="32px">
            </a>
        </aside>

        <main class="content">
            <h1 class="title">Encontre profissionais disponíveis<br>perto de você!</h1>

            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon"></span>
                    <input type="text" class="search-input" placeholder="procurar por serviço / profissional">
                </div>
            </div>

            <h2 class="section-title">Serviços mais procurados</h2>
            <div class="services-grid">
                <div class="service-card">
                    <a href="/Servicos/Limpeza.html">Limpeza residencial</a>
                </div>
                <div class="service-card">
                    <a href="#">Eletricista</a>
                </div>
                <div class="service-card">
                    <a href="#">Encanador</a>
                </div>
                <div class="service-card">
                    <a href="#">Montagem de móveis</a>
                </div>
                <div class="service-card">
                    <a href="#">Pequenos reparos</a>
                </div>
                <div class="service-card">
                    <a href="#">Jardinagem</a>
                </div>
            </div>

            <h2 class="section-title">estatísticas da plataforma</h2>
            <div class="estatisticas-container">
                <div class="estatistica-item">
                    <span class="estatistica-numero">500+</span>
                    <span class="estatistica-label">Profissionais ativos</span>
                </div>
                <div class="estatistica-item">
                    <span class="estatistica-numero">2.5k</span>
                    <span class="estatistica-label">Serviços realizados</span>
                </div>
                <div class="estatistica-item">
                    <span class="estatistica-numero">4.80</span>
                    <span class="estatistica-label">Avaliação média</span>
                </div>
            </div>
        </main>
    </div>

    <button class="help-button">
        Ajuda / Suporte
    </button>

    <button class="dark-mode-toggle-ini" id="darkModeToggleIni">
        Modo escuro
    </button>

    <script src="/Landing Page/TelaIni.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>

</html>
