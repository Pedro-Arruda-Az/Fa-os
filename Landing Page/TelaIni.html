<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Encontre profissionais</title>
    <link rel="stylesheet" href="/Landing Page/TelaIni.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <style>
        .home-link,
        .perfil-link {
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .home-link:hover,
        .perfil-link:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <span class="header-icon">
                <img src="/imagens/upscalemedia-transformed.png" alt="Facos" width="100px">
            </span>
        </div>
        <div class="header-right">
            <div class="header-icons">
                <a href="/Landing Page/Perfil.html" class="perfil-link" title="Meu Perfil">
                    <img src="/imagens/pessoa.png" alt="Perfil" width="32px">
                </a>
                <a href="/Landing Page/TelaIni.html" class="home-link" title="Início">
                    <img src="/imagens/casa.png" alt="Home" width="28px">
                </a>
                <div class="config-wrap">
                    <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                        <img src="/imagens/engrenagem.png" alt="Configurações" width="26px">
                    </button>
                    <div class="config-menu" id="configMenu">
                        <button class="config-item" id="modoClaroBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                            <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                        </button>
                        <button class="config-item" id="idiomaBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                            <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                        </button>
                        <button class="config-item config-item-sair" id="logoutBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                            <span data-i18n="menu.sair">Sair</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="/Chat/Chat.html" class="sidebar-icon" title="Chat">
                <img src="/imagens/balao-de-bate-papo.png" alt="Chat" width="32px">
            </a>
            <a href="/Localizacao/Localizacao.html" class="sidebar-icon" title="Localização">
                <img src="/imagens/localizacao.png" alt="Localização" width="32px">
            </a>
            <a href="/Pedidos/Pedidos.html" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/prancheta.png" alt="Pedidos" width="32px">
            </a>
            <a href="/Pagamentos/Pagamentos.html" class="sidebar-icon" title="Pagamento">
                <img src="/imagens/cartao.png" alt="Pagamento" width="32px">
            </a>
            <a href="/Sino/Sino.html" class="sidebar-icon" title="Notificações">
                <img src="/imagens/notificacao.png" alt="Notificações" width="32px">
            </a>
        </aside>

        <main class="content">
            <h1 class="title" data-i18n-html="tela.titulo">Encontre profissionais disponíveis<br>perto de você!</h1>

            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon"></span>
                    <input type="text" class="search-input" placeholder="procurar por serviço / profissional" data-i18n-placeholder="tela.buscaPlaceholder">
                </div>
            </div>

            <h2 class="section-title" data-i18n="tela.servicosMaisProcurados">Serviços mais procurados</h2>
            <div class="services-grid">
                <div class="service-card">
                    <a href="/Servicos/Limpeza.html" data-i18n="servico.limpeza">Limpeza</a>
                </div>
                <div class="service-card">
                    <a href="/Servicos/Eletricista.html" data-i18n="servico.eletricista">Eletricista</a>
                </div>
                <div class="service-card">
                    <a href="/Servicos/CasaInstalacoes.html" data-i18n="servico.casaInstalacoes">Casa e instalações</a>
                </div>
                <div class="service-card">
                    <a href="/Servicos/Manutencao.html" data-i18n="servico.manutencao">Manutenção</a>
                </div>
                <div class="service-card">
                    <a href="/Servicos/Jardinagem.html" data-i18n="servico.jardinagem">Jardinagem e áreas externas</a>
                </div>
                <div class="service-card">
                    <a href="/Servicos/TecnologiaAssistencia.html" data-i18n="servico.tecnologia">Tecnologia e assistência</a>
                </div>
            </div>

            <h2 class="section-title" data-i18n="tela.estatisticas">estatísticas da plataforma</h2>
            <div class="estatisticas-container">
                <div class="estatistica-item">
                    <span class="estatistica-numero">500+</span>
                    <span class="estatistica-label" data-i18n="tela.profissionaisAtivos">Profissionais ativos</span>
                </div>
                <div class="estatistica-item">
                    <span class="estatistica-numero">2.5k</span>
                    <span class="estatistica-label" data-i18n="tela.servicosRealizados">Serviços realizados</span>
                </div>
                <div class="estatistica-item">
                    <span class="estatistica-numero">4.80</span>
                    <span class="estatistica-label" data-i18n="tela.avaliacaoMedia">Avaliação média</span>
                </div>
            </div>
        </main>
    </div>

    <button class="help-button" data-i18n="tela.ajudaSuporte">
        Ajuda / Suporte
    </button>

    <script src="/i18n-cliente.js"></script>
    <script src="/Landing Page/TelaIni.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>

</html>
