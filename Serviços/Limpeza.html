<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Limpeza Residencial</title>
    <link rel="stylesheet" href="/Serviços/limpeza.css">
    <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <img src="/imagens/upscalemedia-transformed.png" alt="Faços" class="logo-img">
        </div>
        <div class="header-right">
            <a href="/Profissional/home_profissional.html" class="header-link">seja um profissional</a>
            <div class="header-icons">
                <a href="/Landing Page/TelaIni.html" class="icon-btn" title="Home">
                    <img src="/imagens/casa.png" alt="Home" width="28">
                </a>
                <a href="#" class="icon-btn" title="Perfil">
                    <img src="/imagens/pessoa.png" alt="Perfil" width="32">
                </a>
                <button class="logout-btn" id="logoutBtn">sair</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="#" class="sidebar-icon" title="Chat">
                <img src="/imagens/balao-de-bate-papo.png" alt="" width = "32px">
            </a>
            <a href="#" class="sidebar-icon" title="Localização">
                <img src="/imagens/localizacao.png" alt="Localização" width="36">
            </a>
            <a href="#" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/prancheta.png" alt="Pedidos" width="28">
            </a>
            <a href="#" class="sidebar-icon" title="Pagamento">
                <img src="/imagens/cartao.png" alt="Pagamento" width="28">
            </a>
            <a href="#" class="sidebar-icon" title="Notificações">
                <img src="/imagens/notificacao.png" alt="Notificações" width="28">
            </a>
            <button class="sidebar-toggle" id="sidebarToggle" title="Recolher">&#8249;</button>
        </aside>

        <section class="list-panel">
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="procurar por serviço / profissional"
                    value="Limpeza residencial"
                    autocomplete="off"
                >
            </div>

            <div class="results-count" id="resultsCount">4 profissionais encontrados</div>

            <div class="professionals-list" id="professionalsList">
                <!-- Cards gerados pelo JS -->
            </div>
        </section>

        <!-- PAINEL DIREITO: mapa -->
        <section class="map-panel" id="mapPanel">
            <div id="map"></div>
            <div class="map-overlay-label">São Paulo</div>
        </section>

    </div>

    <!-- MODAL DE PERFIL DO PROFISSIONAL -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-avatar" id="modalAvatar">?</div>
                <div>
                    <h2 class="modal-name" id="modalName">—</h2>
                    <p class="modal-service" id="modalService">—</p>
                    <div class="modal-stars" id="modalStars"></div>
                </div>
            </div>
            <div class="modal-info">
                <div class="modal-info-item">
                    <span class="info-label">Distância</span>
                    <span class="info-value" id="modalDist">—</span>
                </div>
                <div class="modal-info-item">
                    <span class="info-label">Avaliação</span>
                    <span class="info-value" id="modalRating">—</span>
                </div>
                <div class="modal-info-item">
                    <span class="info-label">Serviços</span>
                    <span class="info-value" id="modalServices">—</span>
                </div>
                <div class="modal-info-item">
                    <span class="info-label">Preço médio</span>
                    <span class="info-value" id="modalPrice">—</span>
                </div>
            </div>
            <button class="solicitar-btn" id="solicitarBtn">Solicitar atendimento</button>
        </div>
    </div>

    <!-- BOTÃO AJUDA -->
    <button class="help-button">
        <span>&#10067;</span> ajuda / suporte
    </button>

    <!-- Leaflet (mapa open-source, sem API key) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/Serviços/limpeza.js"></script>
</body>
</html>
