<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Entrar</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-page hex-page">
        <div class="auth-hero">
            <a href="index.html" class="auth-logo-link">
                <img src="/imagens/facos-logo-completo.png" alt="Faços" class="auth-logo-full">
            </a>

            <h1 class="auth-heading">Bem-Vindo de volta!</h1>
            <p class="auth-heading-sub">Entre na sua conta para acessar a plataforma</p>
        </div>

        <div class="auth-card auth-card-tabs">
            <div class="tab-switch">
                <button type="button" class="tab-btn active" id="tabEmpresas" data-tab="empresas">Empresas</button>
                <button type="button" class="tab-btn" id="tabProfissionais" data-tab="profissionais">Profissionais</button>
            </div>

            <!-- ===== LOGIN EMPRESAS ===== -->
            <div class="tab-panel active" id="painelEmpresas">
                <label>Email</label>
                <input type="email" id="empresaEmail" placeholder="voce@email.com">

                <label>CNPJ</label>
                <input type="tel" id="empresaCNPJ" placeholder="00.000.000/0000-00" maxlength="18">

                <label>Senha</label>
                <input type="password" id="empresaSenha" placeholder="Digite sua senha">

                <a href="#" class="esqueci-senha" data-tipo="empresas">Esqueci minha senha</a>

                <button class="auth-btn" id="entrarEmpresaBtn">Entrar</button>

                <p class="auth-troca">Não tem uma conta? <a href="cadastro.html"><strong>Cadastre-se!</strong></a></p>
            </div>

            <!-- ===== LOGIN PROFISSIONAIS (CPF) ===== -->
            <div class="tab-panel" id="painelProfissionais">
                <label>Email</label>
                <input type="email" id="profEmail" placeholder="voce@email.com">

                <label>CPF</label>
                <input type="tel" id="profCPF" placeholder="000.000.000-00" maxlength="14">

                <label>Senha</label>
                <input type="password" id="profSenha" placeholder="Digite sua senha">

                <a href="#" class="esqueci-senha" data-tipo="profissionais">Esqueci minha senha</a>

                <button class="auth-btn" id="entrarProfBtn">Entrar</button>

                <p class="auth-troca">Não tem uma conta? <a href="cadastro.html"><strong>Cadastre-se!</strong></a></p>
            </div>
        </div>
    </div>

    <!-- MODAL DE REDEFINIR SENHA -->
    <div id="redefinirSenhaModal" class="modal">
        <div class="modal-content">
            <span class="close-modal close-redefinir">&times;</span>
            <h2>Defina sua nova senha</h2>
            <label>Nova senha</label>
            <input type="password" id="novaSenhaInput" placeholder="Digite a nova senha">
            <label>Confirmar nova senha</label>
            <input type="password" id="confirmarNovaSenhaInput" placeholder="Confirme a nova senha">
            <button class="auth-btn" id="confirmarNovaSenhaBtn">Confirmar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
