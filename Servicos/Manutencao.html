<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Manutenção</title>
    <link rel="stylesheet" href="/Servicos/Manutencao.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <img src="/imagens/upscalemedia-transformed.png" alt="Faços" class="logo-img">
        </div>
        <div class="header-right">
            <div class="header-icons">
                <a href="/Landing Page/Perfil.html" class="icon-btn" title="Perfil">
                    <img src="/imagens/icones-claro/perfil.png" alt="Perfil" width="32">
                </a>
                <a href="/Landing Page/TelaIni.html" class="icon-btn" title="Home">
                    <img src="/imagens/icones-claro/casinha-header.png" alt="Home" width="28">
                </a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <a href="/Chat/Chat.html" class="sidebar-icon" title="Chat">
                <img src="/imagens/icones-claro/mensagens.png" alt="Chat" width="32px">
            </a>
            <a href="/Localizacao/Localizacao.html" class="sidebar-icon" title="Localização">
                <img src="/imagens/icones-claro/localizacao.png" alt="Localização" width="32px">
            </a>
            <a href="/Pedidos/Pedidos.html" class="sidebar-icon" title="Pedidos">
                <img src="/imagens/icones-claro/pedidos.png" alt="Pedidos" width="32px">
            </a>
            <a href="/Pagamentos/Pagamentos.html" class="sidebar-icon" title="Pagamento">
                <img src="/imagens/icones-claro/carteira.png" alt="Pagamento" width="32px">
            </a>
            <a href="/Sino/Sino.html" class="sidebar-icon" title="Notificações">
                <img src="/imagens/icones-claro/notificacoes.png" alt="Notificações" width="32px">
                <span class="notif-badge" data-notif-badge style="display:none;"></span>
            </a>
            <div class="config-wrap">
                <button class="config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                    <img src="/imagens/engrenagem.png" alt="Configurações" width="22px">
                </button>
                <div class="config-menu config-menu-sidebar" id="configMenu">
                    <button class="config-item" id="modoClaroBtn">
                        <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-escuro-lua.png" alt="" width="18" height="18">
                        <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                    </button>
                    <button class="config-item" id="idiomaBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                        <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                    </button>
                    <button class="config-item config-item-sair" id="logoutBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                        <span data-i18n="menu.sair">Sair</span>
                    </button>
                </div>
            </div>
        </aside>

        <section class="list-panel">
            <div class="search-box">
                <span class="search-icon"></span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="procurar por serviço / profissional"
                    value="Manutenção"
                    autocomplete="off"
                >
            </div>

            <div class="results-count" id="resultsCount">0 profissionais encontrados</div>

            <div class="professionals-list" id="professionalsList">
                
            </div>
        </section>

        <section class="detail-panel" id="detailPanel">
            <div class="detail-empty" id="detailEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <h3>Selecione um profissional</h3>
                <p>Clique em alguém da lista para ver os detalhes e solicitar o serviço</p>
            </div>

            <div class="detail-content" id="detailContent">
                <div class="modal-header">
                    <div class="modal-avatar" id="modalAvatar">?</div>
                    <div>
                        <h2 class="modal-name" id="modalName">—</h2>
                        <p class="modal-service" id="modalService">—</p>
                        <div class="modal-stars" id="modalStars"></div>
                    </div>
                </div>
                <div class="modal-info">
                    <div class="modal-info-item">
                        <span class="info-label">Distância</span>
                        <span class="info-value" id="modalDist">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="info-label">Avaliação</span>
                        <span class="info-value" id="modalRating">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="info-label">Serviços</span>
                        <span class="info-value" id="modalServices">—</span>
                    </div>
                    <div class="modal-info-item">
                        <span class="info-label">Preço</span>
                        <span class="info-value" id="modalPrice">—</span>
                    </div>
                </div>
                <button class="solicitar-btn" id="solicitarBtn">Solicitar atendimento</button>
            </div>
        </section>

    </div>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-card">
            <button class="modal-close" id="paymentModalClose">&times;</button>
            <h2 class="pagamento-title">Forma de pagamento</h2>
            <p class="pagamento-subtitle" id="pagamentoSubtitle">Como você quer pagar por esse serviço?</p>

            <div class="pagamento-resumo">
                <span class="pagamento-resumo-label">Valor do serviço</span>
                <span class="pagamento-resumo-valor" id="pagamentoValor">R$ 0,00</span>
            </div>

            <div class="pagamento-opcoes">
                <button class="pagamento-opcao" data-metodo="carteira">
                    <span class="pagamento-opcao-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></span>
                    <span class="pagamento-opcao-texto">
                        <span class="pagamento-opcao-titulo">Saldo da carteira</span>
                        <span class="pagamento-opcao-sub" id="saldoDisponivelTexto">Carregando saldo...</span>
                    </span>
                </button>
                <button class="pagamento-opcao" data-metodo="mercadopago">
                    <span class="pagamento-opcao-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></span>
                    <span class="pagamento-opcao-texto">
                        <span class="pagamento-opcao-titulo">Mercado Pago</span>
                        <span class="pagamento-opcao-sub">Cartão, PIX ou boleto</span>
                    </span>
                </button>
            </div>

            <button class="confirmar-pagamento-btn" id="confirmarPagamentoBtn" disabled>Confirmar pagamento</button>
        </div>
    </div>

    <button class="help-button">
        Ajuda / Suporte
    </button>

    <script src="/Shared/i18n-cliente.js"></script>
    <script src="/Shared/notificacoes-badge.js"></script>
    <script src="/Servicos/Manutencao.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
