<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faços - Notificações</title>
    <link rel="stylesheet" href="Sino.css">
    <link rel="stylesheet" href="/Shared/app-shell.css">
    <link rel="stylesheet" href="/Buzz/buzz.css">
</head>
<body>

    <script>document.body.classList.toggle('dark-mode', localStorage.getItem('darkMode') === 'enabled');</script>

        <header class="header">
        <div class="header-left">
            <a href="/Landing Page/TelaIni.html" class="brand-mark">
                <img src="/imagens/facos-logo-marrom.png" alt="FAÇOS" class="brand-logo icon-claro">
                <img src="/imagens/facos-logo-completo.png" alt="FAÇOS" class="brand-logo icon-escuro">
            </a>
        </div>
        <div class="header-right">
            <a href="/Landing Page/Perfil.html" class="topbar-profile-btn" title="Meu perfil">
                <img src="/imagens/icones-claro/perfil.png" alt="" class="icon-claro">
                <img src="/imagens/icones-escuro/perfil.png" alt="" class="icon-escuro">
            </a>
            <a href="/Landing Page/TelaIni.html" class="topbar-icon-btn" title="Início">
                <img src="/imagens/icones-claro/casinha-header.png" alt="" class="icon-claro">
                <img src="/imagens/icones-escuro/casinha-header.png" alt="" class="icon-escuro">
            </a>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="/Chat/Chat.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-icon"><img src="/imagens/icones-claro/mensagens.png" alt="" class="icon-claro"><img src="/imagens/icones-escuro/mensagens.png" alt="" class="icon-escuro"></span>
                    <span class="sidebar-nav-label" data-i18n="menu.mensagens">Mensagens</span>
                </a>
                <a href="/Pedidos/Pedidos.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-icon"><img src="/imagens/icones-claro/pedidos.png" alt="" class="icon-claro"><img src="/imagens/icones-escuro/pedidos.png" alt="" class="icon-escuro"></span>
                    <span class="sidebar-nav-label" data-i18n="menu.pedidos">Pedidos</span>
                </a>
                <a href="/Localizacao/Localizacao.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-icon"><img src="/imagens/icones-claro/agenda.png" alt="" class="icon-claro"><img src="/imagens/icones-escuro/agenda.png" alt="" class="icon-escuro"></span>
                    <span class="sidebar-nav-label" data-i18n="menu.servicos">Serviços</span>
                </a>
                <a href="/Localizacao/Mapa.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-icon"><img src="/imagens/icones-claro/localizacao.png" alt="" class="icon-claro"><img src="/imagens/icones-escuro/localizacao.png" alt="" class="icon-escuro"></span>
                    <span class="sidebar-nav-label" data-i18n="menu.localizacao">Localização</span>
                </a>
                <a href="/Pagamentos/Pagamentos.html" class="sidebar-nav-item">
                    <span class="sidebar-nav-icon"><img src="/imagens/icones-claro/carteira.png" alt="" class="icon-claro"><img src="/imagens/icones-escuro/carteira.png" alt="" class="icon-escuro"></span>
                    <span class="sidebar-nav-label" data-i18n="menu.carteira">Carteira</span>
                </a>
                <a href="/Sino/Sino.html" class="sidebar-nav-item active">
                    <span class="sidebar-nav-icon"><img src="/imagens/icones-claro/notificacoes.png" alt="" class="icon-claro"><img src="/imagens/icones-escuro/notificacoes.png" alt="" class="icon-escuro"></span>
                    <span class="sidebar-nav-label" data-i18n="menu.notificacoes">Notificações</span>
                    <span class="notif-badge" data-notif-badge style="display:none;"></span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="config-wrap">
                    <button class="sidebar-nav-item config-trigger" id="configBtn" title="Configurações" aria-label="Configurações">
                        <span class="sidebar-nav-icon"><span class="config-gear-icon"></span></span>
                        <span class="sidebar-nav-label" data-i18n="menu.configuracoes">Configurações</span>
                    </button>
                    <div class="config-menu config-menu-sidebar" id="configMenu">
                        <button class="config-item" id="modoClaroBtn">
                            <img id="modoClaroIcone" src="/imagens/icones-escuro/modo-escuro-lua.png" alt="" width="18" height="18">
                            <span id="modoClaroLabel" data-i18n="menu.modoEscuro">Modo escuro</span>
                        </button>
                        <button class="config-item" id="idiomaBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
                            <span id="idiomaLabel" data-i18n="menu.idioma">Idioma: PT</span>
                        </button>
                        <button class="config-item config-item-sair" id="logoutBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                            <span data-i18n="menu.sair">Sair</span>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="notificacoes-content">
            <h1 class="page-title" data-i18n="menu.notificacoes">Notificações</h1>

            <div class="status-badge" id="statusBadge">
                <span data-i18n="sino.voceTem">Você tem</span> <span id="unreadCount">2</span> <span data-i18n="sino.notificacoesNaoLidas">notificações não lidas</span>
            </div>

            <div class="notificacoes-list" id="notificacoesList">
            </div>
        </main>
    </div>

    <button class="help-button" data-i18n="tela.ajudaSuporte">
        Ajuda / Suporte
    </button>
    <script src="/Shared/i18n-cliente.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/Shared/notificacoes-badge.js"></script>

    <script src="Sino.js"></script>
    <script src="/Buzz/buzz.js"></script>
</body>
</html>
